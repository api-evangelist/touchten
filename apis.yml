aid: touchten
name: Touchten
description: Touchten (Touchten Pte. Ltd.) is an award-winning mobile game studio
  headquartered in Jakarta, Indonesia, and an early 500 Global (500 Startups) portfolio
  company. Its casual games - including Piper's Pet Cafe, Royal Garden Tales, Dessert
  Chain, Warung Chain Go Food Express, and the Teka-Teki Saku (TTS) crossword series -
  are published on the App Store and Google Play, are played by millions worldwide,
  and cater especially to the underserved women gamers market in the US and Europe.
  Touchten won the Google Play Indonesia Games Contest and received the Forbes
  Indonesia Rising Global Stars Award. The company publishes no developer portal or
  public API surface.
